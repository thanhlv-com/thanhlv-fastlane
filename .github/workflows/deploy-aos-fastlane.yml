name: Deploy Android Apps (Google Play Console)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Chọn App Key trong apps.json (hoặc 'all' để chạy toàn bộ Android apps)"
        required: true
        default: "OpsFlow_Hub"
        type: string
      action:
        description: "Hành động thực hiện"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - build_only
      track:
        description: "Track Google Play Console (khi chọn action = deploy)"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      build_type:
        description: "Loại định dạng build (khi chọn action = build_only)"
        required: true
        default: "appbundle"
        type: choice
        options:
          - appbundle
          - apk
      version:
        description: "Version (Tùy chọn, để trống sẽ lấy từ apps.json/pubspec.yaml)"
        required: false
        default: ""
        type: string
      build_number:
        description: "Build Number (Tùy chọn, để trống sẽ tự sinh Epoch timestamp)"
        required: false
        default: ""
        type: string
      flutter_channel:
        description: "Flutter Channel"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      flutter_version:
        description: "Flutter Version cụ thể (Tùy chọn, ví dụ: 3.29.0)"
        required: false
        default: ""
        type: string

# ==============================================================================
# KHAI BÁO TẬP TRUNG TẤT CẢ BIẾN MÔI TRƯỜNG & SECRETS TỪ GITHUB Ở ĐẦU FILE
# ==============================================================================
env:
  # GitHub App & Repository Context
  GH_APP_ID: "3766151"
  GH_APP_PRIVATE_KEY: ${{ secrets.THANHLV_PRIVATE_KEY }}
  GH_REPO_OWNER: ${{ github.repository_owner }}

  # Google Play Console Secrets
  CFG_SUPPLY_JSON_KEY: ${{ secrets.SUPPLY_JSON_KEY }}
  CFG_SUPPLY_JSON_KEY_DATA: ${{ secrets.SUPPLY_JSON_KEY_DATA }}
  CFG_GOOGLE_PLAY_KEY_FILE: ${{ secrets.GOOGLE_PLAY_KEY_FILE }}

  # Workflow Inputs
  INPUT_APP: ${{ inputs.app }}
  INPUT_ACTION: ${{ inputs.action }}
  INPUT_TRACK: ${{ inputs.track }}
  INPUT_BUILD_TYPE: ${{ inputs.build_type }}
  INPUT_VERSION: ${{ inputs.version }}
  INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
  INPUT_FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
  INPUT_FLUTTER_VERSION: ${{ inputs.flutter_version }}

jobs:
  deploy-android:
    name: Android (${{ inputs.app }} -> ${{ inputs.action == 'deploy' && inputs.track || inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Tạo GitHub App Token để truy cập private repo source code
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ env.GH_REPO_OWNER }}

      # 2. Cấu hình Git để tự động dùng App Token
      - name: Configure Git for Private Repositories
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      # 3. Thiết lập Java JDK (yêu cầu cho Android Gradle build)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 4. Thiết lập Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.INPUT_FLUTTER_CHANNEL }}
          flutter-version: ${{ env.INPUT_FLUTTER_VERSION != '' && env.INPUT_FLUTTER_VERSION || '' }}
          cache: true

      # 5. Thiết lập Ruby & Cài đặt Fastlane qua Bundler (có cache)
      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # 6. Thực thi Fastlane Android Deploy / Build (Đổi tên sang biến Fastlane nội bộ)
      - name: Run Fastlane Android
        env:
          SUPPLY_JSON_KEY: ${{ env.CFG_SUPPLY_JSON_KEY }}
          SUPPLY_JSON_KEY_DATA: ${{ env.CFG_SUPPLY_JSON_KEY_DATA }}
          GOOGLE_PLAY_KEY_FILE: ${{ env.CFG_GOOGLE_PLAY_KEY_FILE }}
          CI: "true"
        run: |
          # Map các biến nội bộ trong bash
          TARGET_APP="$INPUT_APP"
          ACTION_TYPE="$INPUT_ACTION"
          RELEASE_TRACK="$INPUT_TRACK"
          OUTPUT_TYPE="$INPUT_BUILD_TYPE"

          EXTRA_ARGS=""
          if [ -n "$INPUT_VERSION" ]; then
            EXTRA_ARGS="$EXTRA_ARGS version:$INPUT_VERSION"
          fi

          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            EXTRA_ARGS="$EXTRA_ARGS build_number:$INPUT_BUILD_NUMBER"
          else
            EPOCH_BUILD_NUMBER=$(date +%s)
            echo "🕒 Tự động tạo Build Number (Epoch): $EPOCH_BUILD_NUMBER"
            EXTRA_ARGS="$EXTRA_ARGS build_number:$EPOCH_BUILD_NUMBER"
          fi

          if [ "$TARGET_APP" = "all" ]; then
            echo "🔍 Đang lọc danh sách app hỗ trợ nền tảng Android từ fastlane/apps.json..."
            AOS_APPS=$(jq -r 'to_entries[] | select(.value.platforms == null or (.value.platforms | map(ascii_downcase) | (index("aos") or index("android")))) | .key' fastlane/apps.json)
            
            if [ -z "$AOS_APPS" ]; then
              echo "⚠️ Không tìm thấy app nào hỗ trợ nền tảng Android trong apps.json!"
              exit 1
            fi

            echo "🚀 Danh sách app Android sẽ chạy: $AOS_APPS"
            for app_key in $AOS_APPS; do
              echo "=================================================="
              echo "🚀 Đang xử lý ($ACTION_TYPE): $app_key"
              echo "=================================================="
              if [ "$ACTION_TYPE" = "deploy" ]; then
                bundle exec fastlane aos deploy app:$app_key track:$RELEASE_TRACK $EXTRA_ARGS || exit 1
              else
                bundle exec fastlane aos build app:$app_key type:$OUTPUT_TYPE $EXTRA_ARGS || exit 1
              fi
            done
          else
            echo "🚀 Đang xử lý ($ACTION_TYPE): $TARGET_APP"
            if [ "$ACTION_TYPE" = "deploy" ]; then
              bundle exec fastlane aos deploy app:$TARGET_APP track:$RELEASE_TRACK $EXTRA_ARGS
            else
              bundle exec fastlane aos build app:$TARGET_APP type:$OUTPUT_TYPE $EXTRA_ARGS
            fi
          fi

      # 7. Upload AAB & APK Artifacts để tải trực tiếp trên GitHub Actions
      - name: Upload Android Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            .workspace/*/build/app/outputs/bundle/**/*.aab
            .workspace/*/build/app/outputs/flutter-apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 14
