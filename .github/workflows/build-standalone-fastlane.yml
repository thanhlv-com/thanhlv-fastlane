name: Build Standalone Desktop Apps (DMG, EXE, AppImage)
run-name: "Standalone: ${{ inputs.app }} (${{ inputs.platform }})${{ inputs.version != '' && format(' (v{0})', inputs.version) || '' }}"

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Chọn App Key trong apps.json (Electron / Desktop)"
        required: true
        default: "web-clone"
        type: choice
        options:
          - "web-clone"
      platform:
        description: "Nền tảng build Standalone ('all' để build đồng thời cả macOS, Windows, Linux)"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "macos"
          - "windows"
          - "linux"
      version:
        description: "Version (Tùy chọn, để trống sẽ lấy từ apps.json / package.json)"
        required: false
        default: ""
        type: string
      build_number:
        description: "Build Number (Tùy chọn, để trống sẽ tự sinh Epoch timestamp)"
        required: false
        default: ""
        type: string
      skip_certs:
        description: "Bỏ qua ký mã nguồn (Skip Code Signing)"
        required: false
        default: false
        type: boolean
      notarize:
        description: "Tự động công chứng Apple Notarization và đóng dấu (Staple) cho macOS DMG"
        required: false
        default: true
        type: boolean
      release:
        description: "Tạo GitHub Release và tải lên các file build thành công"
        required: false
        default: false
        type: boolean

# ==============================================================================
# KHAI BÁO TẬP TRUNG TẤT CẢ BIẾN MÔI TRƯỜNG & SECRETS TỪ GITHUB Ở ĐẦU FILE
# ==============================================================================
env:
  # GitHub App & Repository Context
  GH_APP_ID: "3766151"
  GH_APP_PRIVATE_KEY: ${{ secrets.THANHLV_PRIVATE_KEY }}
  GH_REPO_OWNER: ${{ github.repository_owner }}
  KEYSTORE_REPO_NAME: "apple-certificates-keystore"

  # Apple Developer & App Store Connect Secrets (Dùng khi cần chứng chỉ ký DMG macOS & Notarization)
  CFG_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  CFG_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  CFG_ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
  CFG_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CFG_ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}

  # Fastlane Match Secrets
  CFG_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  CFG_MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD || 'ci_secure_keychain_pass' }}

  # Workflow Inputs
  INPUT_APP: ${{ inputs.app }}
  INPUT_PLATFORM: ${{ inputs.platform }}
  INPUT_VERSION: ${{ inputs.version }}
  INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
  INPUT_SKIP_CERTS: ${{ inputs.skip_certs }}
  INPUT_NOTARIZE: ${{ inputs.notarize }}
  INPUT_RELEASE: ${{ inputs.release }}

jobs:
  pre-check:
    name: Pre-Flight Release Check & Target Resolution
    if: inputs.release == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_repo: ${{ steps.resolve.outputs.target_repo }}
      target_owner: ${{ steps.resolve.outputs.target_owner }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      app_name: ${{ steps.resolve.outputs.app_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve App Config & Target Release Repository
        id: resolve
        env:
          INPUT_APP: ${{ inputs.app }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node -e '
          const fs = require("fs");
          const apps = JSON.parse(fs.readFileSync("fastlane/apps.json", "utf8"));
          const appKey = process.env.INPUT_APP;
          const app = apps[appKey];
          if (!app) {
            console.error(`::error::Không tìm thấy cấu hình cho app "${appKey}" trong fastlane/apps.json`);
            process.exit(1);
          }

          const inputVersion = (process.env.INPUT_VERSION || "").trim();
          const version = inputVersion !== "" ? inputVersion : (app.version || "1.0.0");
          const releaseTag = `v${version}`;

          // Ưu tiên release_download nếu có, nếu không thì dùng git_url
          const rawUrl = (app.release_download && app.release_download.trim() !== "")
            ? app.release_download.trim()
            : (app.git_url ? app.git_url.trim() : "");

          if (!rawUrl) {
            console.error(`::error::Không tìm thấy release_download hoặc git_url cho app "${appKey}"`);
            process.exit(1);
          }

          const match = rawUrl.match(/github\.com[:/]([^/]+)\/([^/.]+)(?:\.git)?$/);
          if (!match) {
            console.error(`::error::Không thể parse URL repo GitHub: ${rawUrl}`);
            process.exit(1);
          }

          const owner = match[1];
          const repo = match[2];
          const targetRepo = `${owner}/${repo}`;
          const appName = app.app_name || appKey;

          console.log(`📌 App: ${appName} (${appKey})`);
          console.log(`📌 Version: ${version} (Tag: ${releaseTag})`);
          console.log(`📌 Target Repo: ${targetRepo} (Owner: ${owner})`);

          const outputFile = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(outputFile, `target_repo=${targetRepo}\n`);
          fs.appendFileSync(outputFile, `target_owner=${owner}\n`);
          fs.appendFileSync(outputFile, `version=${version}\n`);
          fs.appendFileSync(outputFile, `release_tag=${releaseTag}\n`);
          fs.appendFileSync(outputFile, `app_name=${appName}\n`);
          '

      - name: Generate GitHub App Token for Target Owner
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.resolve.outputs.target_owner }}

      - name: Verify No Duplicate Release Exists (Rule 1)
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TARGET_REPO: ${{ steps.resolve.outputs.target_repo }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          echo "🔍 Kiểm tra xem release version $VERSION (tag: $RELEASE_TAG) đã tồn tại trên repo $TARGET_REPO chưa..."

          EXISTS=false
          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            EXISTS=true
            EXISTING_TAG="$RELEASE_TAG"
          elif gh release view "$VERSION" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            EXISTS=true
            EXISTING_TAG="$VERSION"
          fi

          if [ "$EXISTS" = "true" ]; then
            echo "::error::❌ LỖI: Bản release cho version $VERSION (tag: $EXISTING_TAG) đã tồn tại trên repo $TARGET_REPO! Vui lòng nâng version trước khi tạo release mới."
            exit 1
          fi

          echo "✅ Xác thực thành công: Repo target $TARGET_REPO chưa có bản release nào match với version $VERSION."

  build-macos:
    name: Build macOS Standalone (${{ inputs.app }})
    needs: [pre-check]
    if: |
      always() &&
      (needs.pre-check.result == 'success' || needs.pre-check.result == 'skipped') &&
      (inputs.platform == 'all' || inputs.platform == 'macos')
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Tạo GitHub App Token để truy cập private keystore và repo source code
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ env.GH_REPO_OWNER }}

      # 2. Cấu hình Git để tự động dùng App Token cho tất cả repo thuộc GitHub
      - name: Configure Git for Private Repositories
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      # 3. Thiết lập Node.js (dành cho Electron apps)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Thiết lập Ruby & Fastlane qua Bundler (có cache)
      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # 5. Thực thi Standalone macOS Build
      - name: Run Fastlane Standalone macOS
        env:
          ASC_KEY_ID: ${{ env.CFG_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.CFG_ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ env.CFG_ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ env.CFG_APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ env.CFG_ITC_TEAM_ID }}
          MATCH_PASSWORD: ${{ env.CFG_MATCH_PASSWORD }}
          MATCH_GIT_URL: "https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/${{ env.GH_REPO_OWNER }}/${{ env.KEYSTORE_REPO_NAME }}.git"
          MATCH_KEYCHAIN_PASSWORD: ${{ env.CFG_MATCH_KEYCHAIN_PASSWORD }}
          CI: "true"
        run: |
          EXTRA_ARGS=""
          if [ -n "$INPUT_VERSION" ]; then
            EXTRA_ARGS="$EXTRA_ARGS version:$INPUT_VERSION"
          fi
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            EXTRA_ARGS="$EXTRA_ARGS build_number:$INPUT_BUILD_NUMBER"
          else
            EPOCH_BUILD_NUMBER=$(date +%s)
            echo "🕒 Tự động tạo Build Number (Epoch): $EPOCH_BUILD_NUMBER"
            EXTRA_ARGS="$EXTRA_ARGS build_number:$EPOCH_BUILD_NUMBER"
          fi
          if [ "$INPUT_SKIP_CERTS" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS skip_certs:true"
          fi
          if [ "$INPUT_NOTARIZE" = "false" ]; then
            EXTRA_ARGS="$EXTRA_ARGS notarize:false"
          else
            EXTRA_ARGS="$EXTRA_ARGS notarize:true"
          fi

          echo "🚀 Đang thực thi: fastlane standalone mac_build app:$INPUT_APP $EXTRA_ARGS"
          bundle exec fastlane standalone mac_build app:$INPUT_APP $EXTRA_ARGS

      # 5.1 Thu thập file .dmg ra thư mục build_output để upload
      - name: Collect macOS Artifacts (.dmg)
        if: always()
        run: |
          rm -rf build_output && mkdir -p build_output
          shopt -s nullglob 2>/dev/null || true
          cp -f .workspace_code/*/dist/*.dmg build_output/ 2>/dev/null || true
          if [ $(ls -1 build_output/*.dmg 2>/dev/null | wc -l) -eq 0 ] && [ -d .workspace_code ]; then
            find .workspace_code -type d \( -name "node_modules" -o -name ".*" -o -name "*unpacked*" \) -prune -o -type f -name "*.dmg" -exec cp -f {} build_output/ \; 2>/dev/null || true
          fi
          echo "📦 Danh sách file trong build_output:"
          ls -la build_output/

      # 6. Upload DMG Artifact
      - name: Upload macOS Standalone Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-macos-${{ inputs.app }}-artifacts
          path: build_output/*.dmg
          if-no-files-found: warn
          retention-days: 14

      # 7. Gửi thông báo Telegram
      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          MESSAGE_THREAD_ID: ${{ vars.MESSAGE_THREAD_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then ICON="✅ SUCCESS"; elif [ "$STATUS" = "cancelled" ]; then ICON="⚠️ CANCELLED"; else ICON="❌ FAILED"; fi
          MESSAGE="🖥️ [Standalone macOS Build]
          • App: ${{ inputs.app }}
          • Platform: macOS (.dmg)
          • Run Number: #${{ github.run_number }}
          • Status: ${ICON}
          • Triggered by: ${{ github.actor }}
          • URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${MESSAGE_THREAD_ID}" \
            --data-urlencode text="${MESSAGE}"

  build-windows:
    name: Build Windows Standalone (${{ inputs.app }})
    needs: [pre-check]
    if: |
      always() &&
      (needs.pre-check.result == 'success' || needs.pre-check.result == 'skipped') &&
      (inputs.platform == 'all' || inputs.platform == 'windows')
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ env.GH_REPO_OWNER }}

      - name: Configure Git for Private Repositories
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run Fastlane Standalone Windows
        shell: bash
        env:
          CI: "true"
        run: |
          EXTRA_ARGS=""
          if [ -n "$INPUT_VERSION" ]; then
            EXTRA_ARGS="$EXTRA_ARGS version:$INPUT_VERSION"
          fi
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            EXTRA_ARGS="$EXTRA_ARGS build_number:$INPUT_BUILD_NUMBER"
          fi

          echo "🚀 Đang thực thi: fastlane standalone win_build app:$INPUT_APP $EXTRA_ARGS"
          bundle exec fastlane standalone win_build app:$INPUT_APP $EXTRA_ARGS

      # 5.1 Thu thập file .exe ra thư mục build_output để upload
      - name: Collect Windows Artifacts (.exe)
        if: always()
        shell: bash
        run: |
          rm -rf build_output && mkdir -p build_output
          shopt -s nullglob 2>/dev/null || true
          cp -f .workspace_code/*/dist/*.exe build_output/ 2>/dev/null || true
          if [ $(ls -1 build_output/*.exe 2>/dev/null | wc -l) -eq 0 ] && [ -d .workspace_code ]; then
            find .workspace_code -type d \( -name "node_modules" -o -name ".*" -o -name "*unpacked*" \) -prune -o -type f -name "*.exe" -exec cp -f {} build_output/ \; 2>/dev/null || true
          fi
          echo "📦 Danh sách file trong build_output:"
          ls -la build_output/

      - name: Upload Windows Standalone Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-windows-${{ inputs.app }}-artifacts
          path: build_output/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Send Telegram Notification
        if: always()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          MESSAGE_THREAD_ID: ${{ vars.MESSAGE_THREAD_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then ICON="✅ SUCCESS"; elif [ "$STATUS" = "cancelled" ]; then ICON="⚠️ CANCELLED"; else ICON="❌ FAILED"; fi
          MESSAGE="🖥️ [Standalone Windows Build]
          • App: ${{ inputs.app }}
          • Platform: Windows (.exe)
          • Run Number: #${{ github.run_number }}
          • Status: ${ICON}
          • Triggered by: ${{ github.actor }}
          • URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${MESSAGE_THREAD_ID}" \
            --data-urlencode text="${MESSAGE}"

  build-linux:
    name: Build Linux Standalone (${{ inputs.app }})
    needs: [pre-check]
    if: |
      always() &&
      (needs.pre-check.result == 'success' || needs.pre-check.result == 'skipped') &&
      (inputs.platform == 'all' || inputs.platform == 'linux')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ env.GH_REPO_OWNER }}

      - name: Configure Git for Private Repositories
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run Fastlane Standalone Linux
        env:
          CI: "true"
        run: |
          EXTRA_ARGS=""
          if [ -n "$INPUT_VERSION" ]; then
            EXTRA_ARGS="$EXTRA_ARGS version:$INPUT_VERSION"
          fi
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            EXTRA_ARGS="$EXTRA_ARGS build_number:$INPUT_BUILD_NUMBER"
          fi

          echo "🚀 Đang thực thi: fastlane standalone linux_build app:$INPUT_APP $EXTRA_ARGS"
          bundle exec fastlane standalone linux_build app:$INPUT_APP $EXTRA_ARGS

      # 5.1 Thu thập file .AppImage ra thư mục build_output để upload
      - name: Collect Linux Artifacts (.AppImage)
        if: always()
        run: |
          rm -rf build_output && mkdir -p build_output
          shopt -s nullglob 2>/dev/null || true
          cp -f .workspace_code/*/dist/*.AppImage build_output/ 2>/dev/null || true
          if [ $(ls -1 build_output/*.AppImage 2>/dev/null | wc -l) -eq 0 ] && [ -d .workspace_code ]; then
            find .workspace_code -type d \( -name "node_modules" -o -name ".*" -o -name "*unpacked*" \) -prune -o -type f -name "*.AppImage" -exec cp -f {} build_output/ \; 2>/dev/null || true
          fi
          echo "📦 Danh sách file trong build_output:"
          ls -la build_output/

      # 6. Upload AppImage Artifact
      - name: Upload Linux Standalone Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-linux-${{ inputs.app }}-artifacts
          path: build_output/*.AppImage
          if-no-files-found: warn
          retention-days: 14

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          MESSAGE_THREAD_ID: ${{ vars.MESSAGE_THREAD_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then ICON="✅ SUCCESS"; elif [ "$STATUS" = "cancelled" ]; then ICON="⚠️ CANCELLED"; else ICON="❌ FAILED"; fi
          MESSAGE="🖥️ [Standalone Linux Build]
          • App: ${{ inputs.app }}
          • Platform: Linux (.AppImage)
          • Run Number: #${{ github.run_number }}
          • Status: ${ICON}
          • Triggered by: ${{ github.actor }}
          • URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${MESSAGE_THREAD_ID}" \
            --data-urlencode text="${MESSAGE}"

  publish-release:
    name: Publish Standalone GitHub Release
    needs: [pre-check, build-macos, build-windows, build-linux]
    if: |
      always() &&
      inputs.release == true &&
      (needs.pre-check.result == 'success') &&
      (inputs.platform != 'all' || (needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success')) &&
      (inputs.platform != 'macos' || needs.build-macos.result == 'success') &&
      (inputs.platform != 'windows' || needs.build-windows.result == 'success') &&
      (inputs.platform != 'linux' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Tạo GitHub App Token cho Owner của repo target (hỗ trợ cross-org release)
      - name: Generate GitHub App Token for Release Target
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ needs.pre-check.outputs.target_owner }}

      # 2. Tải về toàn bộ artifacts từ các build jobs
      - name: Download Standalone Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      # 3. Thu gom toàn bộ file cài đặt (.dmg, .exe, .AppImage) vào thư mục release_assets
      - name: Aggregate Release Assets
        id: assets
        run: |
          mkdir -p release_assets
          # Chỉ copy các file sản phẩm cuối, loại bỏ các file tool nội bộ nếu có
          find ./downloaded_artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" \) | while read -r file; do
            filename=$(basename "$file")
            case "$filename" in
              7z*|candle.exe|light.exe|nuget.exe|elevate.exe|rcedit.exe|signtool.exe|esbuild.exe|electron.exe|*Mono*.exe|StubExecutable.exe|WriteZipToSetup.exe|SyncReleases.exe|Squirrel.exe|Setup.exe)
                echo "⚠️ Bỏ qua file tool nội bộ: $filename"
                ;;
              *)
                cp -f "$file" release_assets/
                ;;
            esac
          done
          echo "📦 Danh sách file đính kèm bản release:"
          ls -lh release_assets/
          ASSET_COUNT=$(ls -1 release_assets/ 2>/dev/null | wc -l | tr -d ' ')
          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "::error::❌ Không tìm thấy bất kỳ file binary nào (.dmg, .exe, .AppImage) để tạo release!"
            exit 1
          fi
          echo "count=$ASSET_COUNT" >> $GITHUB_OUTPUT

      # 4. Tạo bản Release và upload files lên repo target bằng GitHub CLI (gh)
      - name: Publish GitHub Release
        id: gh_release
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TARGET_REPO: ${{ needs.pre-check.outputs.target_repo }}
          RELEASE_TAG: ${{ needs.pre-check.outputs.release_tag }}
          VERSION: ${{ needs.pre-check.outputs.version }}
          APP_NAME: ${{ needs.pre-check.outputs.app_name }}
        run: |
          TITLE="$APP_NAME v$VERSION"

          # Tạo nội dung changelog và danh sách file
          NOTES="## 🚀 $APP_NAME v$VERSION

          ### 📦 File phát hành Standalone Desktop:
          $(ls -1 release_assets/ | sed 's/^/- /')

          ---
          - **App Key**: \`${{ inputs.app }}\`
          - **Version**: \`$VERSION\`
          - **Release Tag**: \`$RELEASE_TAG\`
          - **Nền tảng build**: \`${{ inputs.platform }}\`
          - **Commit**: \`${{ github.sha }}\`
          - **Workflow Run**: [Xem trên GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          echo "🚀 Đang tạo release trên $TARGET_REPO với tag $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" ./release_assets/* \
            --repo "$TARGET_REPO" \
            --title "$TITLE" \
            --notes "$NOTES"

          RELEASE_URL="https://github.com/$TARGET_REPO/releases/tag/$RELEASE_TAG"
          echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT
          echo "🎉 Bản release đã được tạo thành công: $RELEASE_URL"

      # 5. Gửi thông báo Telegram thông báo hoàn tất release
      - name: Send Telegram Release Notification
        if: always() && steps.gh_release.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          MESSAGE_THREAD_ID: ${{ vars.MESSAGE_THREAD_ID }}
        run: |
          RELEASE_URL="${{ steps.gh_release.outputs.release_url }}"
          MESSAGE="🎉 [Standalone GitHub Release Published]
          • App: ${{ needs.pre-check.outputs.app_name }} (${{ inputs.app }})
          • Version: v${{ needs.pre-check.outputs.version }}
          • Target Repo: ${{ needs.pre-check.outputs.target_repo }}
          • Platform: ${{ inputs.platform }}
          • Assets: ${{ steps.assets.outputs.count }} file (.dmg, .exe, .AppImage)
          • Release URL: ${RELEASE_URL}
          • Triggered by: ${{ github.actor }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${MESSAGE_THREAD_ID}" \
            --data-urlencode text="${MESSAGE}"
