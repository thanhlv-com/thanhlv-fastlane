name: Sync Developer ID Certificate (macOS Notarization)
run-name: "Sync Developer ID Cert: ${{ !inputs.readonly && 'Tạo mới nếu thiếu [WRITE]' || 'Kiểm tra [READ-ONLY]' }}${{ inputs.force && ' [FORCE RENEW]' || '' }}"

on:
  workflow_dispatch:
    inputs:
      readonly:
        description: "Chế độ Read-only (Bỏ chọn checkbox này để tự động tạo mới & push lên Keystore nếu cert chưa có hoặc hết hạn)"
        required: true
        default: false
        type: boolean
      force:
        description: "Bắt buộc tạo mới chứng chỉ Developer ID (Force Renewal)"
        required: true
        default: false
        type: boolean
      clean_old_certs:
        description: "Dọn dẹp các chứng chỉ hết hạn trên máy trước khi chạy"
        required: true
        default: true
        type: boolean

# ==============================================================================
# KHAI BÁO TẬP TRUNG TẤT CẢ BIẾN MÔI TRƯỜNG & SECRETS TỪ GITHUB
# ==============================================================================
env:
  # GitHub App & Repository Context
  GH_APP_ID: "3766151"
  GH_APP_PRIVATE_KEY: ${{ secrets.THANHLV_PRIVATE_KEY }}
  GH_REPO_OWNER: ${{ github.repository_owner }}
  KEYSTORE_REPO_NAME: "apple-certificates-keystore"

  # Apple Developer & App Store Connect Secrets
  CFG_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  CFG_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  CFG_ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
  CFG_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CFG_ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}

  # Fastlane Match Secrets
  CFG_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  CFG_MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD || 'ci_secure_keychain_pass' }}

  # Inputs
  INPUT_READONLY: ${{ inputs.readonly }}
  INPUT_FORCE: ${{ inputs.force }}
  INPUT_CLEAN_OLD_CERTS: ${{ inputs.clean_old_certs }}

jobs:
  sync-developer-id:
    name: "Sync Developer ID Application Cert"
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Tạo GitHub App Token có quyền ghi vào apple-certificates-keystore
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ env.GH_REPO_OWNER }}

      # 2. Cấu hình Git dùng Token để push được vào Keystore
      - name: Configure Git for Private Repositories
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      # 3. Cài đặt Ruby & Bundler
      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # 4. Thực thi Fastlane Match Developer ID Sync
      - name: Run Fastlane Sync Developer ID
        env:
          ASC_KEY_ID: ${{ env.CFG_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.CFG_ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ env.CFG_ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ env.CFG_APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ env.CFG_ITC_TEAM_ID }}
          MATCH_PASSWORD: ${{ env.CFG_MATCH_PASSWORD }}
          MATCH_GIT_URL: "https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/${{ env.GH_REPO_OWNER }}/${{ env.KEYSTORE_REPO_NAME }}.git"
          MATCH_KEYCHAIN_PASSWORD: ${{ env.CFG_MATCH_KEYCHAIN_PASSWORD }}
          CI: "true"
        run: |
          ARGS="readonly:$INPUT_READONLY force:$INPUT_FORCE"
          if [ "$INPUT_CLEAN_OLD_CERTS" = "true" ]; then
            echo "🧹 Dọn dẹp certificates cũ trên máy CI..."
            bundle exec fastlane clean_local_certs
          fi

          echo "🚀 Đang thực thi: bundle exec fastlane standalone sync_developer_id $ARGS"
          bundle exec fastlane standalone sync_developer_id $ARGS

      # 5. Gửi thông báo Telegram
      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          MESSAGE_THREAD_ID: ${{ vars.MESSAGE_THREAD_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then ICON="✅ SUCCESS"; elif [ "$STATUS" = "cancelled" ]; then ICON="⚠️ CANCELLED"; else ICON="❌ FAILED"; fi
          MESSAGE="🛡️ [Developer ID Application Cert Sync]
          • Type: Developer ID Application (macOS)
          • Readonly: ${{ inputs.readonly }}
          • Force: ${{ inputs.force }}
          • Run Number: #${{ github.run_number }}
          • Status: ${ICON}
          • Triggered by: ${{ github.actor }}
          • URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${MESSAGE_THREAD_ID}" \
            --data-urlencode text="${MESSAGE}"
