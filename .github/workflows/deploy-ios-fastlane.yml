name: Deploy iOS Apps (TestFlight & App Store)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Chọn App Key trong apps.json (hoặc 'all' để áp dụng toàn bộ)"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "OpsFlow_Hub"
          - "session_browser_app"
          - "app_github_pro"
      action:
        description: "Hành động thực hiện"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - build_only
          - upload_metadata
      target:
        description: "Mục tiêu phát hành (khi chọn action = deploy)"
        required: true
        default: "testflight"
        type: choice
        options:
          - testflight
          - appstore
      version:
        description: "Version (Tùy chọn, để trống sẽ lấy từ apps.json/pubspec.yaml)"
        required: false
        default: ""
        type: string
      build_number:
        description: "Build Number (Tùy chọn, để trống sẽ tự sinh Epoch timestamp)"
        required: false
        default: ""
        type: string
      flutter_channel:
        description: "Flutter Channel"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      flutter_version:
        description: "Flutter Version cụ thể (Tùy chọn, ví dụ: 3.29.0)"
        required: false
        default: ""
        type: string

# ==============================================================================
# KHAI BÁO TẬP TRUNG TẤT CẢ BIẾN MÔI TRƯỜNG & SECRETS TỪ GITHUB Ở ĐẦU FILE
# ==============================================================================
env:
  # GitHub App & Repository Context
  GH_APP_ID: "3766151"
  GH_APP_PRIVATE_KEY: ${{ secrets.THANHLV_PRIVATE_KEY }}
  GH_REPO_OWNER: ${{ github.repository_owner }}
  KEYSTORE_REPO_NAME: "apple-certificates-keystore"

  # Apple Developer & App Store Connect Secrets
  CFG_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  CFG_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  CFG_ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
  CFG_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CFG_ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}

  # Fastlane Match Secrets
  CFG_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  CFG_MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD || 'ci_secure_keychain_pass' }}

  # Workflow Inputs
  INPUT_APP: ${{ inputs.app }}
  INPUT_ACTION: ${{ inputs.action }}
  INPUT_TARGET: ${{ inputs.target }}
  INPUT_VERSION: ${{ inputs.version }}
  INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
  INPUT_FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
  INPUT_FLUTTER_VERSION: ${{ inputs.flutter_version }}

jobs:
  deploy-ios:
    name: iOS (${{ inputs.app }} -> ${{ inputs.action == 'deploy' && inputs.target || 'build_only' }})
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Tạo GitHub App Token để truy cập private keystore và các repo source code
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ env.GH_REPO_OWNER }}

      # 2. Cấu hình Git để tự động dùng App Token cho tất cả repo thuộc GitHub
      - name: Configure Git for Private Repositories
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      # 3. Thiết lập Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.INPUT_FLUTTER_CHANNEL }}
          flutter-version: ${{ env.INPUT_FLUTTER_VERSION != '' && env.INPUT_FLUTTER_VERSION || '' }}
          cache: true

      # 4. Thiết lập Ruby & Cài đặt Fastlane qua Bundler (có cache)
      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # 5. Thực thi Fastlane iOS Deploy / Build (Đổi tên sang biến Fastlane nội bộ)
      - name: Run Fastlane iOS
        env:
          ASC_KEY_ID: ${{ env.CFG_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.CFG_ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ env.CFG_ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ env.CFG_APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ env.CFG_ITC_TEAM_ID }}
          MATCH_PASSWORD: ${{ env.CFG_MATCH_PASSWORD }}
          MATCH_GIT_URL: "https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/${{ env.GH_REPO_OWNER }}/${{ env.KEYSTORE_REPO_NAME }}.git"
          MATCH_KEYCHAIN_PASSWORD: ${{ env.CFG_MATCH_KEYCHAIN_PASSWORD }}
          CI: "true"
        run: |
          # Map các biến nội bộ trong bash
          TARGET_APP="$INPUT_APP"
          ACTION_TYPE="$INPUT_ACTION"
          TARGET_ENV="$INPUT_TARGET"

          EXTRA_ARGS=""
          if [ -n "$INPUT_VERSION" ]; then
            EXTRA_ARGS="$EXTRA_ARGS version:$INPUT_VERSION"
          fi

          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            EXTRA_ARGS="$EXTRA_ARGS build_number:$INPUT_BUILD_NUMBER"
          else
            EPOCH_BUILD_NUMBER=$(date +%s)
            echo "🕒 Tự động tạo Build Number (Epoch): $EPOCH_BUILD_NUMBER"
            EXTRA_ARGS="$EXTRA_ARGS build_number:$EPOCH_BUILD_NUMBER"
          fi

          if [ "$TARGET_APP" = "all" ]; then
            echo "🔍 Đang lọc danh sách app hỗ trợ nền tảng iOS từ fastlane/apps.json..."
            IOS_APPS=$(jq -r 'to_entries[] | select(.value.platforms == null or (.value.platforms | map(ascii_downcase) | index("ios"))) | .key' fastlane/apps.json)
            
            if [ -z "$IOS_APPS" ]; then
              echo "⚠️ Không tìm thấy app nào hỗ trợ nền tảng iOS trong apps.json!"
              exit 1
            fi

            echo "🚀 Danh sách app iOS sẽ chạy: $IOS_APPS"
            for app_key in $IOS_APPS; do
              echo "=================================================="
              echo "🚀 Đang xử lý ($ACTION_TYPE): $app_key"
              echo "=================================================="
              if [ "$ACTION_TYPE" = "deploy" ]; then
                bundle exec fastlane ios deploy app:$app_key target:$TARGET_ENV $EXTRA_ARGS || exit 1
              elif [ "$ACTION_TYPE" = "upload_metadata" ]; then
                bundle exec fastlane ios upload_metadata app:$app_key $EXTRA_ARGS || exit 1
              else
                bundle exec fastlane ios build app:$app_key $EXTRA_ARGS || exit 1
              fi
            done
          else
            echo "🚀 Đang xử lý ($ACTION_TYPE): $TARGET_APP"
            if [ "$ACTION_TYPE" = "deploy" ]; then
              bundle exec fastlane ios deploy app:$TARGET_APP target:$TARGET_ENV $EXTRA_ARGS
            elif [ "$ACTION_TYPE" = "upload_metadata" ]; then
              bundle exec fastlane ios upload_metadata app:$TARGET_APP $EXTRA_ARGS
            else
              bundle exec fastlane ios build app:$TARGET_APP $EXTRA_ARGS
            fi
          fi

      # 6. Upload IPA & dSYM Artifacts để tải trực tiếp trên GitHub Actions
      - name: Upload iOS Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-builds
          path: |
            .workspace/*/build/ios/ipa/*.ipa
            .workspace/*/build/ios/ipa/*.dSYM.zip
          if-no-files-found: ignore
          retention-days: 14
