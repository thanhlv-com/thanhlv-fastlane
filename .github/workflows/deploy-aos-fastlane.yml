name: Deploy Android Apps (Google Play Console)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Chọn App Key trong apps.json (hoặc 'all' để chạy toàn bộ Android apps)"
        required: true
        default: "OpsFlow_Hub"
        type: string
      action:
        description: "Hành động thực hiện"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - build_only
      track:
        description: "Track Google Play Console (khi chọn action = deploy)"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      build_type:
        description: "Loại định dạng build (khi chọn action = build_only)"
        required: true
        default: "appbundle"
        type: choice
        options:
          - appbundle
          - apk
      version:
        description: "Version (Tùy chọn, để trống sẽ lấy từ apps.json/pubspec.yaml)"
        required: false
        default: ""
        type: string
      build_number:
        description: "Build Number (Tùy chọn, để trống sẽ tự sinh Epoch timestamp)"
        required: false
        default: ""
        type: string
      flutter_channel:
        description: "Flutter Channel"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      flutter_version:
        description: "Flutter Version cụ thể (Tùy chọn, ví dụ: 3.29.0)"
        required: false
        default: ""
        type: string

jobs:
  deploy-android:
    name: Android (${{ inputs.app }} -> ${{ inputs.action == 'deploy' && inputs.track || inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Tạo GitHub App Token để truy cập private repo source code
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: 3766151
          private-key: ${{ secrets.THANHLV_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # 2. Cấu hình Git để tự động dùng App Token
      - name: Configure Git for Private Repositories
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      # 3. Thiết lập Java JDK (yêu cầu cho Android Gradle build)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 4. Thiết lập Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          flutter-version: ${{ inputs.flutter_version != '' && inputs.flutter_version || '' }}
          cache: true

      # 5. Thiết lập Ruby & Cài đặt Fastlane qua Bundler (có cache)
      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # 6. Thực thi Fastlane Android Deploy / Build
      - name: Run Fastlane Android
        env:
          SUPPLY_JSON_KEY: ${{ secrets.SUPPLY_JSON_KEY }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.SUPPLY_JSON_KEY_DATA }}
          GOOGLE_PLAY_KEY_FILE: ${{ secrets.GOOGLE_PLAY_KEY_FILE }}
          CI: "true"
        run: |
          # Xác định Version và Build Number
          EXTRA_ARGS=""
          if [ -n "${{ inputs.version }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS version:${{ inputs.version }}"
          fi

          if [ -n "${{ inputs.build_number }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS build_number:${{ inputs.build_number }}"
          else
            EPOCH_BUILD_NUMBER=$(date +%s)
            echo "🕒 Tự động tạo Build Number (Epoch): $EPOCH_BUILD_NUMBER"
            EXTRA_ARGS="$EXTRA_ARGS build_number:$EPOCH_BUILD_NUMBER"
          fi

          ACTION="${{ inputs.action }}"
          TRACK="${{ inputs.track }}"
          BUILD_TYPE="${{ inputs.build_type }}"

          if [ "${{ inputs.app }}" = "all" ]; then
            echo "🔍 Đang lọc danh sách app hỗ trợ nền tảng Android từ fastlane/apps.json..."
            AOS_APPS=$(jq -r 'to_entries[] | select(.value.platforms == null or (.value.platforms | map(ascii_downcase) | (index("aos") or index("android")))) | .key' fastlane/apps.json)
            
            if [ -z "$AOS_APPS" ]; then
              echo "⚠️ Không tìm thấy app nào hỗ trợ nền tảng Android trong apps.json!"
              exit 1
            fi

            echo "🚀 Danh sách app Android sẽ chạy: $AOS_APPS"
            for app_key in $AOS_APPS; do
              echo "=================================================="
              echo "🚀 Đang xử lý ($ACTION): $app_key"
              echo "=================================================="
              if [ "$ACTION" = "deploy" ]; then
                bundle exec fastlane aos deploy app:$app_key track:$TRACK $EXTRA_ARGS || exit 1
              else
                bundle exec fastlane aos build app:$app_key type:$BUILD_TYPE $EXTRA_ARGS || exit 1
              fi
            done
          else
            echo "🚀 Đang xử lý ($ACTION): ${{ inputs.app }}"
            if [ "$ACTION" = "deploy" ]; then
              bundle exec fastlane aos deploy app:${{ inputs.app }} track:$TRACK $EXTRA_ARGS
            else
              bundle exec fastlane aos build app:${{ inputs.app }} type:$BUILD_TYPE $EXTRA_ARGS
            fi
          fi

      # 7. Upload AAB & APK Artifacts để tải trực tiếp trên GitHub Actions
      - name: Upload Android Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            .workspace/*/build/app/outputs/bundle/**/*.aab
            .workspace/*/build/app/outputs/flutter-apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 14
