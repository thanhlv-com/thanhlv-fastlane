name: Register Apple Identifiers & App Store Connect Apps
run-name: "Register Apple: ${{ inputs.platform }}${{ inputs.app != 'all' && format(' ({0})', inputs.app) || ' (All Apps Parallel Matrix)' }}"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Nền tảng cần kiểm tra & đăng ký"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - ios
          - macos
      app:
        description: "Chọn App Key trong apps.json (hoặc 'all' để áp dụng toàn bộ)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "CloudOps"
          - "session_browser_app"
          - "app_github_pro"
          - "app_Lam_Toan_Tre_Con"
          - "app-snapvid"
          - "app-QuestFlow"
          - "app_Comparison_Table_App"
          - "app-dem-tien-vn"
          - "app-dem-tien-jp"
          - "AR-Drawing"
          - "app-dem-tien-usd"
          - "app-dem-tien-china"
          - "app-dem-tien-eur"
          - "app-go-mo-niem-phat"

# ==============================================================================
# KHAI BÁO TẬP TRUNG TẤT CẢ BIẾN MÔI TRƯỜNG & SECRETS TỪ GITHUB Ở ĐẦU FILE
# ==============================================================================
env:
  # GitHub App & Repository Context
  GH_APP_ID: "3766151"
  GH_APP_PRIVATE_KEY: ${{ secrets.THANHLV_PRIVATE_KEY }}
  GH_REPO_OWNER: ${{ github.repository_owner }}
  KEYSTORE_REPO_NAME: "apple-certificates-keystore"

  # Apple Developer & App Store Connect Secrets
  CFG_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  CFG_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  CFG_ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
  CFG_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CFG_ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}

  # Fastlane Match Secrets
  CFG_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

  # Workflow Inputs
  INPUT_PLATFORM: ${{ inputs.platform }}
  INPUT_APP: ${{ inputs.app }}

jobs:
  # ============================================================================
  # 1. Xác định danh sách Apps (Matrix) cần chạy song song
  # ============================================================================
  prepare-matrix:
    name: Prepare Parallel Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      apps_count: ${{ steps.set-matrix.outputs.apps_count }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute Target Matrix
        id: set-matrix
        env:
          INPUT_APP: ${{ inputs.app }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          ruby -rjson -e '
            data = JSON.parse(File.read("fastlane/apps.json"))
            app_input = ENV["INPUT_APP"].to_s.strip
            platform_input = ENV["INPUT_PLATFORM"].to_s.strip.downcase

            norm_platform = case platform_input
                            when "both", "all", "" then "all"
                            when "ios" then "ios"
                            when "macos", "mac", "osx" then "macos"
                            else "all"
                            end

            def normalize_p(p)
              case p.to_s.downcase.strip
              when "macos", "mac", "osx" then "macos"
              when "ios" then "ios"
              else p.to_s.downcase.strip
              end
            end

            target_apps = if app_input == "all" || app_input.empty?
              data.select do |k, v|
                platforms = (v["platforms"] || ["ios", "android"]).map { |p| normalize_p(p) }
                if norm_platform == "all"
                  platforms.include?("ios") || platforms.include?("macos")
                else
                  platforms.include?(norm_platform)
                end
              end.keys
            else
              [app_input]
            end

            matrix_include = target_apps.map do |app_key|
              { "app" => app_key, "platform" => norm_platform }
            end

            matrix_json = JSON.generate({ "include" => matrix_include })
            puts "Target apps count: #{target_apps.size}"
            puts "Generated matrix: #{matrix_json}"

            File.open(ENV["GITHUB_OUTPUT"], "a") do |f|
              f.puts "matrix=#{matrix_json}"
              f.puts "apps_count=#{target_apps.size}"
            end
          '

  # ============================================================================
  # 2. Thực thi kiểm tra & đăng ký chạy SONG SONG qua Matrix
  # ============================================================================
  register-apple:
    name: "Register: ${{ matrix.app }} [${{ matrix.platform }}]"
    needs: prepare-matrix
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Tạo GitHub App Token để truy cập private keystore repo (nếu cần tải AuthKey .p8)
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ env.GH_REPO_OWNER }}

      # 2. Cấu hình Git để tự động dùng App Token
      - name: Configure Git for Private Repositories
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      # 3. Thiết lập Ruby & Fastlane
      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # 4. Thực thi kiểm tra & đăng ký Apple Identifiers & App Store Connect App
      - name: Run Apple Identifiers & Apps Registration
        env:
          ASC_KEY_ID: ${{ env.CFG_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.CFG_ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ env.CFG_ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ env.CFG_APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ env.CFG_ITC_TEAM_ID }}
          MATCH_PASSWORD: ${{ env.CFG_MATCH_PASSWORD }}
          MATCH_GIT_URL: "https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/${{ env.GH_REPO_OWNER }}/${{ env.KEYSTORE_REPO_NAME }}.git"
          CI: "true"
        run: |
          PLATFORM_ARG="platform:${{ matrix.platform }}"
          APP_ARG="app:${{ matrix.app }}"

          echo "=================================================="
          echo "🍎 [MATRIX JOB] Kiểm tra & Đăng ký Apple: ${{ matrix.app }} (${{ matrix.platform }})..."
          echo "=================================================="
          bundle exec fastlane register_apps $APP_ARG $PLATFORM_ARG

      # 5. Gửi thông báo Telegram khi hoàn thành hoặc có lỗi
      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ vars.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ vars.MESSAGE_THREAD_ID }}
          message: |
            🍎 [Apple Register App & Identifiers]
            • App: ${{ matrix.app }}
            • Platform: ${{ matrix.platform }}
            • Run Number: #${{ github.run_number }}
            • Status: ${{ job.status == 'success' && '✅ SUCCESS' || (job.status == 'cancelled' && '⚠️ CANCELLED' || '❌ FAILED') }}
            • Triggered by: ${{ github.actor }}
            • URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

