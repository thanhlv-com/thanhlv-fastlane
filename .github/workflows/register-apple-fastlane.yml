name: Register Apple Identifiers & App Store Connect Apps
run-name: "Register Apple: ${{ inputs.platform }}${{ inputs.app != 'all' && format(' ({0})', inputs.app) || ' (All Apps)' }}"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Nền tảng cần kiểm tra & đăng ký"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - ios
          - macos
      app:
        description: "Chọn App Key trong apps.json (hoặc 'all' để áp dụng toàn bộ)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "CloudOps"
          - "session_browser_app"
          - "app_github_pro"
          - "app_Lam_Toan_Tre_Con"
          - "app-snapvid"
          - "app-QuestFlow"
          - "app_Comparison_Table_App"
          - "app-dem-tien-vn"
          - "app-dem-tien-jp"
          - "AR-Drawing"
          - "app-dem-tien-usd"
          - "app-dem-tien-china"
          - "app-dem-tien-eur"

# ==============================================================================
# KHAI BÁO TẬP TRUNG TẤT CẢ BIẾN MÔI TRƯỜNG & SECRETS TỪ GITHUB Ở ĐẦU FILE
# ==============================================================================
env:
  # GitHub App & Repository Context
  GH_APP_ID: "3766151"
  GH_APP_PRIVATE_KEY: ${{ secrets.THANHLV_PRIVATE_KEY }}
  GH_REPO_OWNER: ${{ github.repository_owner }}
  KEYSTORE_REPO_NAME: "apple-certificates-keystore"

  # Apple Developer & App Store Connect Secrets
  CFG_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  CFG_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  CFG_ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
  CFG_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CFG_ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}

  # Fastlane Match Secrets
  CFG_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

  # Workflow Inputs
  INPUT_PLATFORM: ${{ inputs.platform }}
  INPUT_APP: ${{ inputs.app }}

jobs:
  register-apple:
    name: Register Apple (${{ inputs.platform }} -> ${{ inputs.app }})
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Tạo GitHub App Token để truy cập private keystore repo (nếu cần tải AuthKey .p8)
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ env.GH_REPO_OWNER }}

      # 2. Cấu hình Git để tự động dùng App Token
      - name: Configure Git for Private Repositories
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      # 3. Thiết lập Ruby & Fastlane
      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # 4. Thực thi kiểm tra & đăng ký Apple Identifiers & App Store Connect App
      - name: Run Apple Identifiers & Apps Registration
        env:
          ASC_KEY_ID: ${{ env.CFG_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.CFG_ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ env.CFG_ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ env.CFG_APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ env.CFG_ITC_TEAM_ID }}
          MATCH_PASSWORD: ${{ env.CFG_MATCH_PASSWORD }}
          MATCH_GIT_URL: "https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/${{ env.GH_REPO_OWNER }}/${{ env.KEYSTORE_REPO_NAME }}.git"
          CI: "true"
        run: |
          PLATFORM_ARG="platform:all"
          if [ "$INPUT_PLATFORM" = "ios" ]; then
            PLATFORM_ARG="platform:ios"
          elif [ "$INPUT_PLATFORM" = "macos" ]; then
            PLATFORM_ARG="platform:macos"
          fi

          APP_ARG="app:all"
          if [ -n "$INPUT_APP" ] && [ "$INPUT_APP" != "all" ]; then
            APP_ARG="app:$INPUT_APP"
          fi

          echo "=================================================="
          echo "🍎 Kiểm tra & Đăng ký Apple Identifiers & Apps ($PLATFORM_ARG, $APP_ARG)..."
          echo "=================================================="
          bundle exec fastlane register_apps $APP_ARG $PLATFORM_ARG
