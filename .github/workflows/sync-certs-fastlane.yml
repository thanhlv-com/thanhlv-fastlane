name: Sync Apple Certificates & Profiles (Fastlane Match)
run-name: "Sync Certs: ${{ inputs.platform }} [${{ inputs.type }}]${{ inputs.app != 'all' && format(' ({0})', inputs.app) || ' (All Apps)' }}${{ inputs.platform == 'both' && ' [Parallel Matrix]' || '' }}${{ !inputs.readonly && ' [WRITE]' || '' }}"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Nền tảng cần đồng bộ"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - ios
          - macos
      app:
        description: "Chọn App Key trong apps.json (hoặc 'all' để áp dụng toàn bộ)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "CloudOps"
          - "session_browser_app"
          - "app_github_pro"
          - "app_Lam_Toan_Tre_Con"
          - "app-snapvid"
          - "app-QuestFlow"
          - "app_Comparison_Table_App"
          - "app-dem-tien-vn"
          - "app-dem-tien-jp"
          - "AR-Drawing"
          - "app-dem-tien-usd"
          - "app-dem-tien-china"
          - "app-dem-tien-eur"
          - "app-go-mo-niem-phat"
      type:
        description: "Loại Certificate / Profile"
        required: true
        default: "appstore"
        type: choice
        options:
          - appstore
          - development
          - adhoc
      readonly:
        description: "Chế độ Read-only (Bỏ chọn nếu cần tạo mới/gia hạn certs trên Apple Portal)"
        required: true
        default: true
        type: boolean
      force:
        description: "Bắt buộc tạo mới certs/profiles (force renewal)"
        required: true
        default: false
        type: boolean
      clean_old_certs:
        description: "Dọn dẹp certs/profiles cũ trên máy CI trước khi sync"
        required: true
        default: false
        type: boolean

# ==============================================================================
# KHAI BÁO TẬP TRUNG TẤT CẢ BIẾN MÔI TRƯỜNG & SECRETS TỪ GITHUB Ở ĐẦU FILE
# ==============================================================================
env:
  # GitHub App & Repository Context
  GH_APP_ID: "3766151"
  GH_APP_PRIVATE_KEY: ${{ secrets.THANHLV_PRIVATE_KEY }}
  GH_REPO_OWNER: ${{ github.repository_owner }}
  KEYSTORE_REPO_NAME: "apple-certificates-keystore"

  # Apple Developer & App Store Connect Secrets
  CFG_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  CFG_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  CFG_ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
  CFG_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CFG_ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}

  # Fastlane Match Secrets
  CFG_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  CFG_MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD || 'ci_secure_keychain_pass' }}

  # Workflow Inputs
  INPUT_PLATFORM: ${{ inputs.platform }}
  INPUT_APP: ${{ inputs.app }}
  INPUT_CERT_TYPE: ${{ inputs.type }}
  INPUT_READONLY: ${{ inputs.readonly }}
  INPUT_FORCE: ${{ inputs.force }}
  INPUT_CLEAN_OLD_CERTS: ${{ inputs.clean_old_certs }}

jobs:
  # ============================================================================
  # 1. Xác định danh sách nền tảng (Matrix) cần chạy dựa trên inputs.platform và inputs.app
  # ============================================================================
  prepare-matrix:
    name: Prepare Platforms Matrix
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set-matrix.outputs.platforms }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute Target Platforms
        id: set-matrix
        env:
          INPUT_APP: ${{ inputs.app }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          ruby -rjson -e '
            data = JSON.parse(File.read("fastlane/apps.json"))
            app_input = ENV["INPUT_APP"].to_s.strip
            platform_input = ENV["INPUT_PLATFORM"].to_s.strip.downcase

            def normalize_p(p)
              case p.to_s.downcase.strip
              when "macos", "mac", "osx" then "macos"
              when "ios" then "ios"
              else p.to_s.downcase.strip
              end
            end

            target_platforms = case platform_input
                               when "ios" then ["ios"]
                               when "macos" then ["macos"]
                               else ["ios", "macos"] # "both"
                               end

            # Nếu người dùng chọn 1 app cụ thể, chỉ giữ lại platform mà app đó hỗ trợ
            if app_input != "all" && !app_input.empty? && data[app_input]
              supported = (data[app_input]["platforms"] || ["ios"]).map { |p| normalize_p(p) }
              target_platforms = target_platforms.select { |p| supported.include?(p) }
              target_platforms = ["ios"] if target_platforms.empty?
            end

            json_out = JSON.generate(target_platforms)
            puts "Target Platforms Matrix: #{json_out}"

            File.open(ENV["GITHUB_OUTPUT"], "a") do |f|
              f.puts "platforms=#{json_out}"
            end
          '

  # ============================================================================
  # 2. Thực thi Fastlane Match Sync chạy SONG SONG qua Matrix
  # ============================================================================
  sync-certs:
    name: "Sync Match Certs (${{ matrix.platform }} -> ${{ inputs.type }})"
    needs: prepare-matrix
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare-matrix.outputs.platforms) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Tạo GitHub App Token để truy cập private keystore repo
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ env.GH_REPO_OWNER }}

      # 2. Cấu hình Git để tự động dùng App Token
      - name: Configure Git for Private Repositories
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      # 3. Thiết lập Ruby & Fastlane
      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # 4. Thực thi Fastlane Sync Certs theo nền tảng Matrix
      - name: Run Fastlane Match Sync (${{ matrix.platform }})
        env:
          ASC_KEY_ID: ${{ env.CFG_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.CFG_ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ env.CFG_ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ env.CFG_APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ env.CFG_ITC_TEAM_ID }}
          MATCH_PASSWORD: ${{ env.CFG_MATCH_PASSWORD }}
          MATCH_GIT_URL: "https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/${{ env.GH_REPO_OWNER }}/${{ env.KEYSTORE_REPO_NAME }}.git"
          MATCH_KEYCHAIN_PASSWORD: ${{ env.CFG_MATCH_KEYCHAIN_PASSWORD }}
          CI: "true"
        run: |
          ARGS="type:$INPUT_CERT_TYPE readonly:$INPUT_READONLY force:$INPUT_FORCE clean_old_certs:$INPUT_CLEAN_OLD_CERTS"
          if [ -n "$INPUT_APP" ] && [ "$INPUT_APP" != "all" ]; then
            ARGS="$ARGS app:$INPUT_APP"
          fi

          if [ "${{ matrix.platform }}" = "macos" ]; then
            echo "=================================================="
            echo "🔑 [macOS] Đồng bộ Certificates & Profiles..."
            echo "=================================================="
            bundle exec fastlane mac sync_certs $ARGS
          else
            echo "=================================================="
            echo "🔑 [iOS] Đồng bộ Certificates & Profiles..."
            echo "=================================================="
            bundle exec fastlane ios sync_certs $ARGS
          fi

      # 5. Gửi thông báo Telegram khi hoàn thành hoặc có lỗi
      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ vars.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ vars.MESSAGE_THREAD_ID }}
          message: |
            🔐 [Fastlane Match Sync Certs]
            • Platform: ${{ matrix.platform }}
            • App: ${{ inputs.app }}
            • Type: ${{ inputs.type }}
            • Readonly: ${{ inputs.readonly }}
            • Run Number: #${{ github.run_number }}
            • Status: ${{ job.status == 'success' && '✅ SUCCESS' || (job.status == 'cancelled' && '⚠️ CANCELLED' || '❌ FAILED') }}
            • Triggered by: ${{ github.actor }}
            • URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

